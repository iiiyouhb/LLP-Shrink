name: CPU verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - run: python -W error::RuntimeWarning -W error::DeprecationWarning -m unittest discover -s tests -v
      - run: python -m llp_shrink.train --config configs/smoke.json --output runs/ci
      - run: python -m llp_shrink.evaluate runs/ci/last.pth --device cpu --ema
